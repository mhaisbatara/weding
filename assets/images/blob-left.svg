<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900" preserveAspectRatio="none" fill="none">
  <defs>
    <!-- Soft watercolor wash gradient -->
    <linearGradient id="blobGradLeft1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfd6cb" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#e8e0d5" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#ded5c8" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#d6ccbe" stop-opacity="0.70" />
    </linearGradient>
    <linearGradient id="blobGradLeft2" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e2dad0" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#d9cfc2" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#cfc4b5" stop-opacity="0.4" />
    </linearGradient>
    
    <!-- Subtle watercolor edge filter -->
    <filter id="waterBlur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base organic background layer -->
  <path d="M0,0 
           L220,0 
           C260,110 190,190 180,290 
           C170,390 290,480 300,600 
           C310,720 220,830 190,900 
           L0,900 Z" 
        fill="url(#blobGradLeft1)" 
        filter="url(#waterBlur)" />

  <!-- Secondary organic overlay for watercolor depth -->
  <path d="M0,40 
           C130,50 170,160 160,260 
           C150,360 270,470 280,590 
           C288,690 190,810 120,900 
           L0,900 Z" 
        fill="url(#blobGradLeft2)" />

  <!-- Organic speckles / splatters -->
  <g fill="#c4b6a4" opacity="0.65">
    <circle cx="160" cy="180" r="2.5" />
    <circle cx="175" cy="165" r="1.5" />
    <circle cx="190" cy="195" r="3" />
    <circle cx="145" cy="210" r="1.8" />
    <circle cx="210" cy="175" r="2" />
    <circle cx="225" cy="190" r="1.2" />
    <circle cx="155" cy="235" r="2.8" />
    <circle cx="178" cy="220" r="1.5" />
    <circle cx="198" cy="245" r="3.2" />
    <circle cx="215" cy="230" r="1.6" />
    <circle cx="230" cy="250" r="2.2" />
    <circle cx="180" cy="270" r="2.5" />
    <circle cx="165" cy="290" r="1.8" />
    <circle cx="195" cy="285" r="1.2" />
    <circle cx="220" cy="275" r="2.7" />
    <circle cx="240" cy="265" r="1.5" />
    
    <circle cx="150" cy="320" r="2.2" />
    <circle cx="170" cy="335" r="3" />
    <circle cx="190" cy="315" r="1.7" />
    <circle cx="210" cy="340" r="2.4" />
    <circle cx="235" cy="330" r="1.5" />
    <circle cx="180" cy="360" r="2.6" />
    <circle cx="200" cy="375" r="1.8" />
    <circle cx="225" cy="365" r="3.2" />
    
    <!-- White / light sand highlights -->
    <circle cx="170" cy="190" r="2" fill="#fff" opacity="0.5" />
    <circle cx="185" cy="215" r="2.5" fill="#fff" opacity="0.4" />
    <circle cx="205" cy="260" r="3" fill="#fff" opacity="0.45" />
    <circle cx="175" cy="310" r="2" fill="#fff" opacity="0.35" />
    <circle cx="220" cy="310" r="2.5" fill="#fff" opacity="0.4" />
    <circle cx="190" cy="345" r="3.5" fill="#fff" opacity="0.5" />
    <circle cx="215" cy="385" r="2.2" fill="#fff" opacity="0.4" />
  </g>
</svg>
